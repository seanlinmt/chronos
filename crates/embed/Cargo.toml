[package]
name = "chronos-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible BGE-M3 embedding server (CPU/ONNX) for the DGX Spark cluster"

[[bin]]
name = "chronos-embed"
path = "src/main.rs"

[dependencies]
fastembed = { version = "7.2", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
